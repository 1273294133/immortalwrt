# ============================================================
# 构建 ImmortalWrt 虚拟机镜像（ESXi / PVE / ARM）
# 适用仓库：1273294133/immortalwrt
#
# 矩阵并行构建两种目标，一次跑完你需要的全部虚拟机镜像：
#   x86_64  -> combined.img.gz / combined-efi.img.gz
#              + combined.qcow2 (PVE) + combined.vmdk (ESXi)
#   armv8   -> armsr/armv8 combined-efi.img.gz (raw)
#              + combined-efi.qcow2 (PVE-ARM) + combined-efi.vmdk (ESXi-ARM)
#
# 两种目标都会打包自定义包 quick-start（登录快速启动菜单），
# 前提：把项目根目录的 quick-start/ 复制到你的 fork 源码 package/quick-start/。
#
# 触发：workflow_dispatch 手动运行；或 push 命中 target/package/config 等路径。
# 产物：Actions Artifacts；手动运行时自动发布 GitHub Release。
# ============================================================

name: 构建 ImmortalWrt 虚拟机镜像 (x86_64 + armv8)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'target/**'
      - 'package/**'
      - 'config/**'
      - 'feeds.conf*'
      - 'dl/**'
      - '.github/workflows/build-vm-images.yml'

concurrency:
  group: build-immortalwrt-vm
  cancel-in-progress: false

env:
  # 额外软件包（空格分隔，可留空；需在 feeds 中存在）
  PACKAGES: ""

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target_dir: x86/64
            target_cfg: |
              CONFIG_TARGET_x86=y
              CONFIG_TARGET_x86_64=y
              CONFIG_TARGET_x86_64_DEVICE_generic=y
            artifact: immortalwrt-x86_64-vm-images
          - name: armv8
            target_dir: armsr/armv8
            target_cfg: |
              CONFIG_TARGET_armsr=y
              CONFIG_TARGET_armsr_armv8=y
              CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
            artifact: immortalwrt-armv8-vm-images

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget qemu-utils cpio libelf-dev \
            jq pigz zstd

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成配置（${{ matrix.name }}，ext4 根文件系统 + gzip + EFI）
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_ROOTFS_EXT4FS=y' \
            'CONFIG_TARGET_IMAGES_GZIP=y' \
            'CONFIG_TARGET_EFI_IMAGES=y' \
            'CONFIG_TARGET_KERNEL_PARTSIZE=16' \
            'CONFIG_TARGET_ROOTFS_PARTSIZE=300' \
            '# 打包自定义包 quick-start（登录快速启动菜单）' \
            'CONFIG_PACKAGE_quick-start=y' \
            '${{ matrix.target_cfg }}' > .config
          make defconfig

      - name: 编译固件（${{ matrix.name }}）
        run: |
          make -j$(nproc) V=s

      - name: 转换并打包虚拟机磁盘镜像（${{ matrix.name }}）
        run: |
          set -e
          cd bin/targets/${{ matrix.target_dir }}
          echo "== 原始镜像 =="
          ls -lh *.img.gz 2>/dev/null || true

          # 1) 解压可启动整盘镜像（combined / combined-efi；rootfs 独立镜像不动）
          for f in *combined*.img.gz; do gzip -dk "$f"; done

          # 2) 用 qemu-img 生成 qcow2（PVE）与 vmdk（ESXi）
          for img in *combined*.img; do
            base="${img%.img}"
            qemu-img convert -f raw -O qcow2 "$img" "${base}.qcow2"
            qemu-img convert -f raw -O vmdk -o subformat=streamOptimized,compat6 "$img" "${base}.vmdk"
          done

          # 3) 重新压缩便于上传
          gzip -9 *combined*.qcow2 *combined*.vmdk *combined*.img
          echo "== 虚拟机磁盘产物（${{ matrix.name }}）=="
          ls -lh *.gz

      - name: 上传构建产物（${{ matrix.name }}）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/targets/${{ matrix.target_dir }}/*.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release（手动运行时）
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: immortalwrt-x86_64-vm-images, path: x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: immortalwrt-armv8-vm-images, path: armv8 }

      - name: 计算 Release 标签
        id: tag
        run: echo "TAG=vm-images-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "ImmortalWrt VM images ${{ steps.tag.outputs.TAG }}"
          files: |
            x86_64/*
            armv8/*
          generate_release_notes: true
