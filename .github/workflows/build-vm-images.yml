# ============================================================
# 构建 ImmortalWrt 虚拟机镜像（ESXi / PVE / ARM）— ImageBuilder 版
# 适用仓库：1273294133/immortalwrt
#
# 方案说明：
#   直接使用官方 ImageBuilder（预编译好的工具链 + 软件包）组装镜像，
#   不编译 gcc/musl 等交叉工具链，几分钟即可完成，标准 GitHub runner 也能跑。
#   你的 fork 与上游一致，产物与官方发布相同；quick-start 通过 FILES 覆盖层打进去。
#
# 产物：
#   x86_64 -> combined.img.gz / combined-efi.img.gz + qcow2(PVE) + vmdk(ESXi)
#   armv8  -> armsr/armv8 combined-efi.img.gz + qcow2(PVE-ARM) + vmdk(ESXi-ARM)
#
# 触发：workflow_dispatch 手动；或 push 命中本工作流 / package/quick-start 路径。
# 若你后续改了内核/软件包源码（非纯脚本），需改用源码全量编译，见使用说明。
# ============================================================

name: 构建 ImmortalWrt 虚拟机镜像 (x86_64 + armv8)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-vm-images.yml'
      - 'package/quick-start/**'

env:
  RELEASE: 25.12.2
  BASE: https://downloads.immortalwrt.org/releases

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            target_dir: x86/64
            ib_name: immortalwrt-imagebuilder-25.12.2-x86-64.Linux-x86_64.tar.zst
            artifact: immortalwrt-x86_64-vm-images
          - name: armv8
            target_dir: armsr/armv8
            ib_name: immortalwrt-imagebuilder-25.12.2-armsr-armv8.Linux-x86_64.tar.zst
            artifact: immortalwrt-armv8-vm-images

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gettext python3 rsync wget unzip zstd qemu-utils cpio gawk file

      - name: 下载并解压 ImageBuilder（${{ matrix.name }}）
        run: |
          curl -fL --retry 5 -o ib.tar.zst "$BASE/$RELEASE/targets/${{ matrix.target_dir }}/${{ matrix.ib_name }}"
          tar --zstd -xf ib.tar.zst
          ls -d immortalwrt-imagebuilder-*

      - name: 准备 quick-start 覆盖层（FILES）
        run: |
          mkdir -p files/usr/bin files/etc/profile.d
          cp package/quick-start/files/quick-start      files/usr/bin/quick-start
          cp package/quick-start/files/quick-start.profile files/etc/profile.d/quick-start.sh
          chmod +x files/usr/bin/quick-start files/etc/profile.d/quick-start.sh
          IB=$(ls -d immortalwrt-imagebuilder-*)
          mv files "$IB/files"

      - name: 组装镜像（${{ matrix.name }}）
        run: |
          IB=$(ls -d immortalwrt-imagebuilder-*)
          cd "$IB"
          make image PROFILE=generic FILES=files PACKAGES="" V=s
          echo "== 镜像目录 =="
          ls -lh bin/targets/${{ matrix.target_dir }}

      - name: 转换 qcow2/vmdk 并压缩（${{ matrix.name }}）
        run: |
          set -e
          IB=$(ls -d immortalwrt-imagebuilder-*)
          cd "$IB/bin/targets/${{ matrix.target_dir }}"
          # 解压可启动整盘（combined / combined-efi）
          for f in *combined*.img.gz; do gzip -dk "$f"; done
          # qcow2（PVE）与 vmdk（ESXi）
          for img in *combined*.img; do
            base="${img%.img}"
            qemu-img convert -f raw -O qcow2 "$img" "${base}.qcow2"
            qemu-img convert -f raw -O vmdk -o subformat=streamOptimized,compat6 "$img" "${base}.vmdk"
          done
          gzip -9 *combined*.qcow2 *combined*.vmdk *combined*.img
          echo "== 虚拟机磁盘产物（${{ matrix.name }}）=="
          ls -lh *.gz

      - name: 上传构建产物（${{ matrix.name }}）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: immortalwrt-imagebuilder-*/bin/targets/${{ matrix.target_dir }}/*.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release（手动运行时）
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: immortalwrt-x86_64-vm-images, path: x86_64 }
      - uses: actions/download-artifact@v4
        with: { name: immortalwrt-armv8-vm-images, path: armv8 }

      - name: 计算 Release 标签
        id: tag
        run: echo "TAG=vm-images-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: "ImmortalWrt VM images ${{ steps.tag.outputs.TAG }}"
          files: |
            x86_64/*
            armv8/*
          generate_release_notes: true
